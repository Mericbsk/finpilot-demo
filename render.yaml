services:
  - type: web
    name: finpilot-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ready
    envVars:
      - key: CORS_ORIGINS
        value: https://www.finpilot.at,https://finpilot.at
      - key: FINPILOT_SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: EODHD_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: finpilot@finpilot.at
      - key: SMTP_PASSWORD
        sync: false
      - key: WAITLIST_NOTIFY_TO
        value: finpilot@finpilot.at
    disk:
      name: finpilot-api-data
      mountPath: /app/data
      sizeGB: 1
